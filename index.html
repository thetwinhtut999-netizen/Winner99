<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Phone Duo နှင့် I Phone 18 Pro Max ကံထူးရှင်များ</title>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --gold-primary: #f59e0b;
            --gold-secondary: #fbbf24;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(245, 158, 11, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pyidaungsu', sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 70%); color: var(--text-main); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 30px; padding: 20px; border-bottom: 2px solid var(--border-color); }
        .logo-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-primary); box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); margin-bottom: 15px; }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #f3f4f6 0%, var(--gold-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .search-box { margin-bottom: 30px; text-align: center; }
        .search-box input { width: 100%; max-width: 400px; padding: 12px 20px; border-radius: 25px; border: 1px solid var(--gold-primary); background-color: #111827; color: #fff; font-size: 15px; outline: none; text-align: center; }

        .prize-section { margin-bottom: 35px; }
        .section-title { font-size: 18px; color: var(--gold-secondary); margin: 25px 0 15px 0; border-left: 4px solid var(--gold-primary); padding-left: 10px; text-transform: uppercase; font-weight: bold; }
        
        .winners-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        
        .winner-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 18px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }
        .winner-card:hover { transform: translateY(-3px); border-color: var(--gold-secondary); }

        .prize-img { 
            width: 65px; 
            height: 65px; 
            object-fit: contain; 
            border-radius: 8px; 
            background: rgba(255, 255, 255, 0.05); 
            padding: 5px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .winner-info h3 { font-size: 16px; color: var(--text-main); margin-bottom: 4px; font-weight: bold; }
        .winner-info p { font-size: 14px; color: var(--text-muted); }
        .badge { display: inline-block; font-size: 11px; padding: 2px 8px; background: rgba(245, 158, 11, 0.2); color: var(--gold-secondary); border-radius: 20px; margin-top: 6px; font-weight: bold; }
        .loading { text-align: center; color: var(--gold-secondary); font-size: 16px; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Logo" class="logo-img">
            <h1>I Phone Duo နှင့် I Phone 18 Pro Max ကံထူးရှင်များ</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="နာမည် သို့မဟုတ် ID ဖြင့် ရှာရန်..." onkeyup="filterWinners()">
        </div>

        <div id="winners-container">
            <div class="loading">ကံထူးရှင်စာရင်းများကို ရယူနေပါသည်...</div>
        </div>
    </div>

    <script>
        // Google Sheet Publish to Web (CSV) Link ကို ဒီနေရာမှာ ထည့်ပါ
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ.../pub?output=csv"; 

        let allWinners = [];

        window.onload = function() {
            fetch(csvUrl)
                .then(response => response.text())
                .then(text => {
                    parseCSV(text);
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('winners-container').innerHTML = '<p style="text-align:center; color:#ef4444;">ဒေတာရယူရာတွင် ချိတ်ဆက်မှု အဆင်မပြေပါ။ Google Sheet CSV Link ကို စစ်ဆေးပေးပါ။</p>';
                });
        };

        function parseCSV(text) {
            let lines = text.split("\n");
            let data = [];
            let currentPrize = "Other Prizes";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line === "") continue;

                let cols = line.split(",").map(val => val.replace(/^"|"$/g, '').trim());
                let colA = cols[0] || "";
                let colB = cols[1] || "";
                let colC = cols[2] || "";

                // ခေါင်းစဉ် (ဆုအမျိုးအစား) ဖြစ်နေလျှင်
                if (colB === "" && colC === "" && colA !== "" && colA !== "စဥ်") {
                    currentPrize = colA;
                } 
                // ကံထူးရှင်စာရင်းအချက်အလက် ဖြစ်နေလျှင်
                else if (colA !== "" && colB !== "" && colB !== "အမျိုးအမည်" && colA !== "စဥ်") {
                    data.push({
                        prizeCategory: currentPrize,
                        indexNo: colA,
                        prizeName: colB,
                        memberName: colC
                    });
                }
            }

            allWinners = data;
            displayWinners(data);
        }

        function displayWinners(data) {
            const container = document.getElementById('winners-container');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">ကံထူးရှင်စာရင်း မရှိသေးပါ။</p>';
                return;
            }

            let grouped = {};
            data.forEach(item => {
                let cat = item.prizeCategory;
                if (!grouped[cat]) {
                    grouped[cat] = [];
                }
                grouped[cat].push(item);
            });

            let html = '';
            for (let cat in grouped) {
                html += `<div class="prize-section">
                            <div class="section-title">🏆 ${cat}</div>
                            <div class="winners-grid">`;
                
                grouped[cat].forEach((winner, index) => {
                    let imgFile = "cash.png";
                    let pNameLower = (winner.prizeName || "").toLowerCase();
                    if (pNameLower.includes("duo") || cat.toLowerCase().includes("1st")) {
                        imgFile = "iphone_duo.png";
                    } else if (pNameLower.includes("18") || cat.toLowerCase().includes("2nd")) {
                        imgFile = (index === 0) ? "iphone_18_gold.png" : "iphone_18_silver.png";
                    }

                    html += `
                        <div class="winner-card">
                            <img src="${imgFile}" alt="Prize" class="prize-img">
                            <div class="winner-info">
                                <h3>${winner.prizeName}</h3>
                                <p>မန်ဘာ / ID: ${winner.memberName}</p>
                                <span class="badge">စဉ် - ${winner.indexNo}</span>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        function filterWinners() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allWinners.filter(item => {
                return String(item.memberName).toLowerCase().includes(query) || 
                       String(item.prizeName).toLowerCase().includes(query) ||
                       String(item.prizeCategory).toLowerCase().includes(query) ||
                       String(item.indexNo).toLowerCase().includes(query);
            });
            displayWinners(filtered);
        }
    </script>
</body>
</html>
